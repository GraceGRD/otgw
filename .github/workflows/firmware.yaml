---
name: Build firmware
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      gputils: "http://downloads.sourceforge.net/\
        project/gputils/gputils/1.5.0/gputils-1.5.2.tar.bz2"
      gpsim: "https://downloads.sourceforge.net/\
        project/gpsim/gpsim/0.32.0/gpsim-0.32.1.tar.gz"
      tool_prefix: "${{ github.workspace }}/.toolchain"

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Restore cached toolchain
        id: toolchain-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.tool_prefix }}
          key: ${{ runner.os }}-otgw-toolchain-gputils-1.5.2-gpsim-0.32.1-v1

      - name: Install necessary packages
        run: |
          sudo apt update
          sudo apt install -y libpopt-dev libglib2.0-dev libreadline-dev

      - name: Install gputils
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf "$tool_prefix"
          mkdir -p "$tool_prefix"
          wget -qO- $gputils | tar xjv
          cd gputils-1.5.2
          ./configure --prefix="$tool_prefix"
          make -j2
          make install-exec install-data

      - name: Install gpsim
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: |
          wget -qO- $gpsim | tar xzv
          cd gpsim-0.32.1
          ./configure --disable-gui --prefix="$tool_prefix"
          make -j2
          make install

      - name: Add cached toolchain to PATH
        run: |
          echo "$tool_prefix/bin" >> "$GITHUB_PATH"
          echo "PKG_CONFIG_PATH=$tool_prefix/lib/pkgconfig:$tool_prefix/lib64/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$tool_prefix/lib:$tool_prefix/lib64" >> "$GITHUB_ENV"
          echo "CPATH=$tool_prefix/include" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$tool_prefix/lib:$tool_prefix/lib64" >> "$GITHUB_ENV"

      - name: Build the firmware
        run: make gateway.hex diagnose.hex interface.hex

      - name: Build chmodule
        run: |
          cd chmodule
          ./autogen.sh
          ./configure
          make

      - name: Run test suite
        run: make test

      - name: Rename firmware to tag or commit hash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG=${{ github.ref_name }} # Get the tag name
          else
            TAG=$(echo "${{ github.sha }}" | cut -c1-7) # Use the short commit hash
          fi

          mv gateway.hex gateway-${TAG}.hex
          mv gateway.cod gateway-${TAG}.cod
          mv gateway.lst gateway-${TAG}.lst
          mv gateway.map gateway-${TAG}.map
          mv diagnose.hex diagnose-${TAG}.hex
          mv diagnose.cod diagnose-${TAG}.cod
          mv diagnose.lst diagnose-${TAG}.lst
          mv diagnose.map diagnose-${TAG}.map
          mv interface.hex interface-${TAG}.hex
          mv interface.cod interface-${TAG}.cod
          mv interface.lst interface-${TAG}.lst
          mv interface.map interface-${TAG}.map

      - name: Upload gateway firmware
        uses: actions/upload-artifact@v7
        with:
          name: gateway-${TAG}
          path: |
            gateway*.hex
            gateway*.cod
            gateway*.lst
            gateway*.map

      - name: Upload diagnose firmware
        uses: actions/upload-artifact@v7
        with:
          name: diagnose-${TAG}
          path: |
            diagnose*.hex
            diagnose*.cod
            diagnose*.lst
            diagnose*.map

      - name: Upload interface firmware
        uses: actions/upload-artifact@v7
        with:
          name: interface-${TAG}
          path: |
            interface*.hex
            interface*.cod
            interface*.lst
            interface*.map

      - name: release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            gateway*.hex
            diagnose*.hex
            interface*.hex
          token: ${{ secrets.GITHUB_TOKEN }}
